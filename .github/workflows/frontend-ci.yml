name: Frontend CI

# Runs on every push/PR touching the frontend. Did not exist before this
# workflow was added — nothing gated a push to main, which is how a deleted
# player-list render (frontend/src/components/snake/SnakeRoom.tsx, the
# ROW_MAP_PLACEHOLDER incident) passed straight through: `tsc -b && vite build`
# succeeds on bare JSX text just as readily as on a real render, and nothing
# else was watching. This adds the type-check + build, the engine/board
# selftests (node scripts, no framework), and the vitest render suite that
# actually mounts the draft rooms and checks players appear on screen.

on:
  push:
    branches: [main, "claude/**"]
    paths: ["frontend/**", "backend/**", "data-pipeline/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", "backend/**", "data-pipeline/**", ".github/workflows/frontend-ci.yml"]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom pulls an undici that calls
          # webidl.util.markAsUncloneable, which older 20.x lacks — every
          # vitest file errored on collection with tests never running.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check + build (tsc -b && vite build)
        run: npm run build
      - name: Engine + board selftests (node, no framework)
        run: npm run selftest
      - name: Render tests (vitest + testing-library)
        run: npm test

  # The nickname table exists in TypeScript and in Python. Drift between them is
  # silent — the pipeline stops producing a duplicate while an older board still
  # shows one — so it gets checked on the same push that can cause it.
  name-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Alias tables agree across TS and Python
        working-directory: data-pipeline
        run: python name_parity.py
      # The shipped anchor must be the arithmetic that produced the backtest
      # numbers quoted for it; needs numpy/scipy for blend_with_market's module.
      - run: pip install pandas scipy numpy
      - name: Shipped market anchor matches the backtested one
        working-directory: data-pipeline
        run: python anchor_parity.py
      # Same treatment for roadmap 0.1's expert-projection blend.
      - name: Shipped expert-projection blend matches the backtested one
        working-directory: data-pipeline
        run: python expert_blend_parity.py
      # Same treatment for roadmap 0.3's injury discount.
      - name: Shipped injury discount matches the backtested one
        working-directory: data-pipeline
        run: python injury_discount_parity.py
      # Same treatment for roadmap Phase 1's opportunity model (TE only).
      - name: Shipped opportunity model matches the backtested one
        working-directory: data-pipeline
        run: python opportunity_parity.py
      # integrations.selftest imports the ESPN adapter, which imports httpx.
      # The job had no pip install at all, so it failed on import before
      # reaching a single assertion.
      - run: pip install -r backend/requirements.txt
      - name: Integration parsers + matcher
        working-directory: backend
        run: python -m integrations.selftest
