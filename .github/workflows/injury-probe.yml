name: Injury probe (roadmap 0.3)

# Manual. Answers whether FantasyPros' injuries endpoint serves a REAL, DATED
# report for past seasons, or just today's live status regardless of `year` —
# the precondition for backtesting roadmap step 0.3. Needs the
# FANTASYPROS_API_KEY secret, which is why it cannot run locally.
#
# Three failure modes, none of which raise: empty, stale/echoed across
# seasons, or no games-missed signal (flagged players didn't actually miss
# more games than the field). See the script header.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to probe (space separated)"
        required: false
        default: "2021 2022 2023 2024 2025"
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nflreadpy pandas scipy numpy pyarrow
      - name: Probe historical injury reports
        working-directory: data-pipeline
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python injury_probe.py --seasons ${{ inputs.seasons }} --out ./results
      - uses: actions/upload-artifact@v4
        with:
          name: injury-probe
          path: data-pipeline/results/
