name: Bye-aware lineup value gate (roadmap 2.4)

# Manual. Asks whether valuing players by a week-by-week, bye-aware lineup
# calculation drafts better rosters than the shipped byeClash heuristic.
#
# Scored on REALIZED weekly lineups — set from projections against the real
# bye schedule, scored on what each player actually did that week. Scoring the
# agent on the metric it optimises would be circular, so the scoreboard is
# reality, not the model's own objective.
#
# Needs FANTASYPROS_API_KEY: the opponent bots draft by that season's real ADP.
# Without it they draft by our own model and both arms face a strawman that
# shares our biases.

on:
  workflow_dispatch:
    inputs:
      first:
        description: "First season"
        required: false
        default: "2017"
        type: string
      last:
        description: "Last season"
        required: false
        default: "2025"
        type: string
      seeds:
        description: "Simulated drafts per slot per season"
        required: false
        default: "12"
        type: string
      slots:
        description: "Draft slots to test (comma-separated)"
        required: false
        default: "1,4,7,10"
        type: string

jobs:
  bye-lineup-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install nflreadpy pandas scipy numpy pyarrow

      # The model and the harness both get verified before either is allowed
      # to produce a number that decides whether something ships.
      - name: Model selftest
        run: node frontend/src/engine/bye-lineup-value.selftest.mjs
      - name: Simulator selftest
        run: node frontend/src/engine/draft-sim.selftest.mjs

      - name: Export boards + realized weekly outcomes + byes
        working-directory: data-pipeline
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python export_draft_seasons.py --first ${{ inputs.first }} --last ${{ inputs.last }} --out ./results

      - name: Run the 2.4 gate
        run: |
          node frontend/src/engine/bye-lineup-test.mjs \
            --data data-pipeline/results/draft_seasons.json \
            --seeds ${{ inputs.seeds }} \
            --slots ${{ inputs.slots }} | tee data-pipeline/results/bye_lineup_test.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bye-lineup-test
          path: data-pipeline/results/bye_lineup_test.txt
