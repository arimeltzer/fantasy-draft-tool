name: Survival lookahead test (roadmap 3.1 — STALE, see warning below)

# WARNING — DO NOT DISPATCH AS-IS. This workflow's own past results are real
# (see docs/ROADMAP.md 3.1 RESULT) but the code path it depends on no longer
# exists: draft-sim.mjs's `cfg.survival` branch used to compute survivalCosts
# from a modeled sigma; the simplification replaced that with a deterministic
# margin that ignores sigma entirely. Dispatching this NOW would silently
# exercise the SIMPLIFIED mechanism while this file's own comments describe
# the probabilistic one — a sigma sweep would report perfect "insensitivity"
# for the wrong reason (the parameter isn't read any more, not because it
# doesn't matter), which is precisely the failure mode CLAUDE.md's "npm run
# build does not prove the UI renders" lesson warns about: a test that looks
# clean and exercises the wrong thing. To make this runnable again,
# draft-sim.mjs needs the probabilistic branch restored behind a distinct
# flag (e.g. cfg.survivalModel === 'probabilistic'), separate from the
# shipped cfg.survival path. Not done here — the historical result already
# answered the question this file exists to ask; a second run is not owed
# unless the probabilistic model is reconsidered for shipping.
#
# What this validated, historically: whether a two-ply survival lookahead
# (modeled P(player available at next pick), truncated-normal on ADP with a
# swept dispersion `cv`) earns its place, against the gate pre-registered in
# docs/ROADMAP.md 3.1. Gate cleared on the pre-registered terms; a
# season-clustered robustness check added afterward did not; per-position
# analysis pointed at fragility in the underlying ADP data (see the RESULT
# for the full account, including a correction to an earlier mis-cited
# sigma-sensitivity claim — sigma's sensitivity was never actually
# established with a clean, powered sweep).
#
# The circularity-control (bot temperature) sweep did produce a real,
# well-powered result on this same code before the simplification and is
# recorded in the RESULT — that part does not need re-litigating.

on:
  workflow_dispatch:
    inputs:
      first:
        description: "First season to export"
        required: false
        default: "2017"
        type: string
      last:
        description: "Last season to export"
        required: false
        default: "2025"
        type: string
      seeds:
        description: "Simulated drafts per slot per season"
        required: false
        default: "12"
        type: string
      cvs:
        description: "Sigma sweep (coefficient of variation of draft position)"
        required: false
        default: "0.15,0.25,0.35,0.50,0.75"
        type: string
      temps:
        description: "Bot ADP-faithfulness sweep (higher = looser room)"
        required: false
        default: "1,2,4,8,16"
        type: string

jobs:
  survival-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install nflreadpy pandas scipy numpy pyarrow

      # This decides whether a new mechanism enters the engine. Everything it
      # depends on gets verified before it is allowed to produce a number.
      - name: Survival engine selftest
        run: node frontend/src/engine/survival.selftest.mjs

      - name: Simulator selftest
        run: node frontend/src/engine/draft-sim.selftest.mjs

      - name: Snake engine selftest
        run: node frontend/src/engine/snake-engine.selftest.mjs

      - name: Export historical draft boards
        working-directory: data-pipeline
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: python export_draft_seasons.py --first ${{ inputs.first }} --last ${{ inputs.last }} --out ./results

      - name: Survival lookahead vs shipped engine
        run: |
          node frontend/src/engine/survival-test.mjs \
            --data data-pipeline/results/draft_seasons.json \
            --seeds ${{ inputs.seeds }} \
            --cvs ${{ inputs.cvs }} \
            --temps ${{ inputs.temps }} | tee data-pipeline/results/survival_test.txt

      - uses: actions/upload-artifact@v4
        with:
          name: survival-test
          path: data-pipeline/results/
